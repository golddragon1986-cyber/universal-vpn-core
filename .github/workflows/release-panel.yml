name: Attach panel update to core release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  panel:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build verified panel archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < updates/panel/VERSION)"
          mkdir -p dist
          python scripts/build-panel-release.py "$VERSION" dist/panel.tar.gz > dist/release-info.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('dist/release-info.json').read_text())
          print(f"::notice::Panel {d['version']} archive: {d['size']} bytes, SHA-256 {d['sha256']}")
          PY
      - name: Attach panel to core release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/panel.tar.gz --clobber
      - name: Update stable manifest on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          info=json.loads(Path('dist/release-info.json').read_text())
          tag=os.environ['TAG']
          repository=os.environ['GITHUB_REPOSITORY']
          data={'version':info['version'],'tag':tag,
                'url':f"https://github.com/{repository}/releases/download/{tag}/panel.tar.gz",
                'sha256':info['sha256'],'size':info['size']}
          Path('dist/stable.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git fetch origin main
          git switch -C main origin/main
          mkdir -p updates/panel
          cp dist/stable.json updates/panel/stable.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/panel/stable.json
          if ! git diff --cached --quiet; then
            git commit -m "Point panel updates to ${TAG}"
            git push origin main
          fi
